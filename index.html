<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles/index.css">
    <link href="https://fonts.cdnfonts.com/css/bookman-old-style" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet" />
    <script type="module" src="src/javascript/cart.js" defer></script>
    <script type="module" src="src/javascript/index.js" defer></script>
    <title>Prairie Golem Press</title>
    <script src="src/javascript/global-transition.js" defer></script>
    <link rel="stylesheet" href="src/styles/global-transition.css">
</head>

<body>
    <div class="wrapper">
        <header>
            <div class="header-container">
                <img src="/src/assets/images/index_banner.png" alt="Website banner" id="banner-image">
            </div>
        </header>

        <div class="content">
            <nav class="sidebar page-transition">
                <ul class="nav-links">
                    <li><a href="#" data-target="announcements">Announcements</a></li>
                    <li><a href="#" data-target="space-dracula">Space Dracula</a></li>
                    <li><a href="#" data-target="demon-gate">The Demon Gate</a></li>
                    <li><a href="#" data-target="super-villians">SuperVillains</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>

            <div class="main-content-grid">
                <div class="main-content page-transition">
                    <article id="tab-content">

                    </article>

                </div>
                <div class="product-actions" id="product-actions"></div>
                <a href="/src/html/newsletter.html" class="mailing-list-button">Mailing List Signup</a>
            </div>
        </div>
    </div>
    <button type="button" class="cart-fab" id="cart-fab" aria-label="Open Cart">🛒 <span class="cart-fab__badge" id="cart-count">0</span></button>
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-drawer" id="cart-drawer" aria-hidden="true">
        <div class="cart-drawer__header">
            <h2>Your Cart</h2>
            <button type="button" class="cart-drawer__close" id="cart-drawer-close" aria-label="Close cart">X</button>
        </div>
        <div class="cart-drawer__items" id="cart-drawer-items"></div>
        <p class="cart-drawer__empty" id="cart-drawer-empty" hidden>Your cart is empty.</p>
        <div class="cart-drawer__subtotal" id="cart-drawer-subtotal" hidden>
            <span>Subtotal</span>
            <span class="cart-drawer__subtotal-amount">$0.00</span>
        </div>
        <div class="cart-drawer__footer">
            <a href="/src/html/checkout.html" class="mailing-list-button" id="checkout-button">Go to Checkout</a>
        </div>
    </aside>
</body>

</html>
