<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Plaque | Prairie Golem Press</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tinos:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../styles/plaque-counter.css">
</head>

<body class="plaque-page">

  <main class="plaque-page__stage">

    <section class="plaque" aria-label="Visitor counter plaque">
      <div class="plaque__rim">
        <div class="plaque__face">

          <span class="plaque__screw plaque__screw--left" aria-hidden="true"></span>
          <span class="plaque__screw plaque__screw--right" aria-hidden="true"></span>

          <h1 class="plaque__title">Visitors</h1>

          <div class="plaque__window">
            <span class="counter__value" id="counter-value">000099</span>
          </div>

          <p class="plaque__subtitle">Counter</p>

        </div>
      </div>
    </section>

  </main>

  <!-- <script type="module" src="js/plaque-counter.js"></script> -->

</body>

</html>
