<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golem — Spooky Effects</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/button.css" />
  <link rel="stylesheet" href="../styles/spooky.css" />
  <script defer type="module" src="../javascript/spooky.js"></script>
</head>

<body id="app">

    <div id="top-bar">

      <div id="top-bar-inner">

        <span id="top-bar-label">Corruption Intensity</span>

        <div id="intensity-control">

          <button id="decrease" aria-label="Decrease intensity">-</button>

          <div id="intensity-display">
            <span id="intensity-value">1</span>
            <span id="intensity-max">/10</span>
          </div>

          <button id="increase" aria-label="Increase intensity">+</button>

        </div>

      </div>

    </div>


    <main id="sections-container"></main>

  </div>



</body>
</html>
