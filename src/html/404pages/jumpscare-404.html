<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
    <link rel="stylesheet" href="../../styles/global-glitchy-text.css" />
    <link rel="stylesheet" href="../../styles/404pages/jumpscare-404.css" />
    <script src="../../javascript/global-glitchy-text.js" defer></script>
    <script type="module" src="../../javascript/figure.js" defer></script>
  </head>
  <body>
    <main>
      <div class="vhs-overlay" aria-hidden="true"></div>
      <audio id="static" preload="auto" playsinline>
        <source src="/audio/static.mp3" type="audio/mpeg" />
      </audio>
      <p class="glitch nun hieroglyphics">NUN</p>
      <div class="message">
        <p class="bottom-text">Oops, something's gone wrong...</p>
        <p class="bottom-text">Don't worry, something has noticed you!</p>
      </div>
      <a href="/" class="home-button" data-text="Go Back Home" aria-disabled="true" tabindex="-1" onclick="return false;"><p class="glitch">Go Back Home</p></a>
      <div class="figure-rise" id="figureRise">
        <div
          class="figure-glitch"
          id="figureGlitch"
          style="--figure-img: url(&quot;../../public/images/figure_placeholder.png&quot;)"
          role="img"
          aria-label="A figure emerging"
        ></div>
      </div>
    </main>

    <footer>
      <p class="glitch hieroglyphics">𓇋 𓋴𓅂𓅂 𓇌𓅱𓅲</p>
    </footer>
  </body>
</html>
